# Optional: run PostgreSQL in Docker instead of installing it on your machine.
#   docker compose up -d
# It creates both the development database (settleup) and the test database
# (settleup_test), matching the URLs in backend/.env.example.
services:
  db:
    image: postgres:16
    container_name: settleup-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: settleup
    ports:
      - "5432:5432"
    volumes:
      - settleup-pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create_test_db.sql:/docker-entrypoint-initdb.d/create_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  settleup-pgdata:
